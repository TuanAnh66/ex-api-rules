name: npm publication (disabled until configured)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    environment: npm-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build && pnpm validate && pnpm test
      - name: Require matching tag and declared license
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)throw Error('Version mismatch');for(const n of ['core','cli'])if(require('./packages/'+n+'/package.json').license==='UNLICENSED')throw Error('Maintainer license decision required')"
      - run: pnpm --dir packages/core pack --pack-destination ../../dist
      - run: pnpm --dir packages/cli pack --pack-destination ../../dist
      - name: Publish using configured OIDC trusted publishers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm publish "dist/ex-api-rules-core-$VERSION.tgz" --access public --provenance
          npm publish "dist/ex-api-rules-$VERSION.tgz" --access public --provenance

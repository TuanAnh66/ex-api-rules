name: Prepare GitHub Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build && pnpm validate && pnpm test
      - run: pnpm release
      - run: pnpm --dir packages/core pack --pack-destination ../../dist
      - run: pnpm --dir packages/cli pack --pack-destination ../../dist
      - run: node scripts/release.cjs --checksums
      - run: pnpm test:package
      - name: Create reviewable draft without replacing a prior release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --draft --title "ex-api-rules $VERSION" --notes-file CHANGELOG.md
